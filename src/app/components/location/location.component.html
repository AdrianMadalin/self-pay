<div class="flex w-full items-center gap-2 p-3 hover:cursor-pointer transition">
  <input
    type="checkbox"
    [checked]="isSelected"
    (change)="onCheckboxChange($event)"
    class="w-5 h-5 accent-blue-500 rounded cursor-pointer focus:ring-2 focus:ring-blue-500" />

  <p class="text-gray-700 font-medium">{{ location.name }}</p>
</div>
